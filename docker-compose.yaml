version: '3.8'
services:
  data-cloud:
    build: ./data_cloud
    ports:
      - "8000:8000"
    volumes:
      - ~/.cloudflare:/root/.cloudflare
      - ./my_logger_pkg:/app/my_logger_pkg
  
  data-preprocess:
    build: ./data_preprocess
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./my_logger_pkg:/app/my_logger_pkg
      - ./data_plot:/app/data_plot
  

  model-training:
    build: ./model_training
    ports:
      - "8002:8002"
    volumes:
      - ./my_logger_pkg:/app/my_logger_pkg
      - ./data_plot:/app/data_plot

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - data-preprocess