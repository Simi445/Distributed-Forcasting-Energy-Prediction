version: '3.8'
services:
  data-cloud:
    build: ./data_cloud
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=data_cloud
      - LOGS_DIR=/app/logs
    volumes:
      - ~/.cloudflare:/root/.cloudflare
      - ./my_logger_pkg:/app/my_logger_pkg
      - ./logs:/app/logs
      - ./grids:/app/grids
      - ./data_cloud/parquet:/app/parquet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
  
  data-preprocess:
    build: ./data_preprocess
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - SERVICE_NAME=data_preprocess
      - LOGS_DIR=/app/logs
    volumes:
      - ./my_logger_pkg:/app/my_logger_pkg
      - ./data_plot:/app/data_plot
      - ./logs:/app/logs
    depends_on:
      data-cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
  

  model-training:
    build: ./model_training
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=model_training
      - LOGS_DIR=/app/logs
    volumes:
      - ./my_logger_pkg:/app/my_logger_pkg
      - ./data_plot:/app/data_plot
      - ./logs:/app/logs
      - ./grids:/app/grids
    depends_on:
      data-preprocess:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      model-training:
        condition: service_healthy
